name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore Onevo.Api.csproj
      - run: dotnet build Onevo.Api.csproj -c Release --no-restore
      - run: dotnet publish Onevo.Api.csproj -c Release -o /tmp/onevo-api --no-build

  connector:
    name: Connector (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: connector/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -q
        env:
          PYTHONPATH: .

  dashboard:
    name: Dashboard (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, connector, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: onevo-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: false
          tags: onevo-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build cloud-ai image
        uses: docker/build-push-action@v6
        with:
          context: ./cloud-ai
          push: false
          tags: onevo-cloud-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
