# TLS reverse-proxy template for ONEVO production (nginx + certbot)
#
# 1. Point DNS: app.yourdomain.example and api.yourdomain.example -> VM public IP
# 2. Copy to /etc/nginx/sites-available/onevo-tls and symlink to sites-enabled
# 3. Run: certbot --nginx -d app.yourdomain.example -d api.yourdomain.example
# 4. Set in /opt/onevo/.env:
#      BACKEND_PUBLIC_URL=https://api.yourdomain.example
#      DASHBOARD_BASE_URL=https://app.yourdomain.example
#      CORS_ORIGINS=https://app.yourdomain.example
#      S3_PUBLIC_ENDPOINT=https://api.yourdomain.example/storage
#
# MinIO uploads should be proxied over HTTPS instead of exposing port 9000 publicly.

upstream onevo_backend {
    server 127.0.0.1:8081;
}

upstream onevo_dashboard {
    server 127.0.0.1:4200;
}

upstream onevo_minio {
    server 127.0.0.1:9000;
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.example;

    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.example/privkey.pem;

    location / {
        proxy_pass http://onevo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /storage/ {
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://onevo_minio;
        proxy_set_header Host $host;
        client_max_body_size 500m;
    }
}

server {
    listen 443 ssl http2;
    server_name app.yourdomain.example;

    ssl_certificate     /etc/letsencrypt/live/app.yourdomain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.example/privkey.pem;

    location / {
        proxy_pass http://onevo_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name app.yourdomain.example api.yourdomain.example;
    return 301 https://$host$request_uri;
}
