# Host nginx — TLS termination in front of Docker Compose ports.
# Replace YOUR_APP_DOMAIN and YOUR_API_DOMAIN, then run certbot --nginx.

upstream onevo_dashboard {
    server 127.0.0.1:4200;
}

upstream onevo_backend {
    server 127.0.0.1:8081;
}

server {
    listen 80;
    server_name YOUR_APP_DOMAIN;

    location / {
        proxy_pass http://onevo_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name YOUR_API_DOMAIN;

    location / {
        proxy_pass http://onevo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }
}
